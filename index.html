<title>Painel de Revisão — Amor de Cão</title>
<style>

  *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:#1A1A1A;}
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--verde);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  header h1{font-size:17px;margin:0;flex:1;min-width:200px;} header h1 small{color:var(--cinza);font-weight:400;display:block;font-size:11px;}
  .conex{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;background:#EEE;color:var(--cinza);}
  .conex.on{background:#E6F4D9;color:var(--verde-esc);}
  .prog{font-size:13px;font-weight:700;color:var(--verde-esc);white-space:nowrap;}
  .bar{height:6px;background:#eee;border-radius:3px;width:140px;overflow:hidden;} .bar i{display:block;height:100%;background:var(--verde);width:0%;transition:width .3s;}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;}
  .filtros button{border:1px solid var(--borda);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;}
  .filtros button.on{background:#1A1A1A;color:#fff;border-color:#1A1A1A;}
  main{max-width:980px;margin:0 auto;padding:16px 20px 130px;}
  .fluxo{margin-top:26px;} .fluxo>h2{font-size:20px;border-left:5px solid var(--verde);padding-left:10px;margin:0 0 4px;}
  .fluxo.f-design>h2{border-color:var(--azul);}
  .fluxo>p{margin:0 0 12px 15px;color:var(--cinza);font-size:13px;}
  .tela{background:var(--card);border:1px solid var(--borda);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .tela-h{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;flex-wrap:wrap;}
  .tela-h:hover{background:#F5F5F0;}
  .tela-h .tid{background:var(--verde-esc);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap;}
  .tela-h .tnome{font-weight:700;font-size:14px;flex:1;min-width:140px;}
  .tela-h .tstat{font-size:11px;color:var(--cinza);white-space:nowrap;}
  .tela-h .seta{transition:transform .2s;color:var(--cinza);} .tela.aberta .seta{transform:rotate(90deg);}
  .lk{font-size:11px;font-weight:700;color:var(--azul);text-decoration:none;border:1px solid #BBDEFB;border-radius:6px;padding:3px 8px;white-space:nowrap;}
  .lk:hover{background:#E3F2FD;}
  .bt-notas{font-size:11px;font-weight:700;color:#fff;background:var(--azul);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;}
  .tela-corpo{display:none;border-top:1px solid var(--borda);} .tela.aberta .tela-corpo{display:block;}
  .notas-tela{display:none;background:#F2F7FD;border-bottom:1px solid var(--borda);padding:10px 16px;}
  .notas-tela.aberta{display:block;}
  .notas-tela h4{margin:0 0 6px;font-size:12px;color:var(--azul);}
  .item{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid #F0F0EA;align-items:flex-start;}
  .item:last-child{border-bottom:none;}
  .item.ap{background:#F3FAEC;} .item.aj{background:#FFF8E8;}
  .el{width:145px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.02em;padding-top:4px;}
  .meio{flex:1;min-width:0;}
  .copy{font-size:14px;line-height:1.45;background:#F7F7F2;border:1px solid #ECECE4;border-radius:8px;padding:8px 12px;white-space:pre-wrap;}
  .item.jur .copy{border-left:4px solid var(--pink);}
  .item.gap .copy{border-style:dashed;color:var(--cinza);font-style:italic;}
  .badge{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:2px 6px;margin-bottom:4px;letter-spacing:.03em;}
  .bd-jur{background:var(--pink);color:#fff;} .bd-gap{background:var(--amarelo);color:#fff;} .bd-obs{background:#E8EAF6;color:#3949AB;}
  .bd-quem{background:#ECEFF1;color:#37474F;font-weight:700;}
  .nota{font-size:11.5px;color:var(--cinza);margin-top:4px;}
  .edit{display:none;margin-top:8px;}
  .item.editando .edit{display:block;}
  .edit textarea{width:100%;min-height:60px;font:inherit;font-size:14px;padding:8px 10px;border:2px solid var(--amarelo);border-radius:8px;background:#fff;}
  .thread{margin-top:8px;}
  .cmt{font-size:12.5px;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;margin-bottom:4px;}
  .cmt b{font-size:11px;} .cmt .hora{color:var(--cinza);font-size:10px;margin-left:6px;}
  .cmt-form{display:flex;gap:6px;margin-top:4px;}
  .cmt-form input{flex:1;font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--borda);border-radius:8px;background:#fff;}
  .cmt-form button{border:none;background:#1A1A1A;color:#fff;border-radius:8px;padding:0 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;padding-top:2px;}
  .btns button{width:96px;border-radius:8px;border:1px solid var(--borda);background:#fff;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;}
  .btns .b-ap.on{background:var(--verde);border-color:var(--verde);color:#fff;}
  .btns .b-aj.on{background:var(--amarelo);border-color:var(--amarelo);color:#fff;}
  .btns .b-x{color:var(--cinza);font-weight:400;}
  .lock{font-size:11px;color:var(--pink);font-weight:700;width:96px;text-align:center;padding-top:6px;}
  .p-CEO{color:var(--pink);} .p-Copy{color:var(--verde-esc);} .p-Design{color:var(--azul);} .p-Dev{color:var(--laranja);}
  footer{position:fixed;bottom:0;left:0;right:0;background:#1A1A1A;color:#fff;padding:10px 20px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:60;flex-wrap:wrap;}
  footer .f-n{font-weight:800;} footer .sp{flex:1;}
  footer button{border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:12px;}
  dialog{border:none;border-radius:12px;max-width:780px;width:92%;padding:0;}
  dialog .d-h{background:#1A1A1A;color:#fff;padding:12px 18px;display:flex;align-items:center;}
  dialog .d-h b{flex:1;} dialog .d-h button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}
  dialog pre{margin:0;padding:16px;font-size:12px;max-height:58vh;overflow:auto;white-space:pre-wrap;background:#FAFAF7;}
  dialog .d-f{padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--borda);}
  dialog .d-f button{border-radius:8px;border:none;padding:8px 14px;font-weight:700;cursor:pointer;}
  #login{border-radius:14px;padding:0;max-width:380px;}
  #login .l-c{padding:22px;}
  #login h2{margin:0 0 4px;font-size:18px;} #login p{margin:0 0 14px;color:var(--cinza);font-size:13px;}
  #login input,#login select{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--borda);border-radius:8px;margin-bottom:10px;}
  #login button{width:100%;background:var(--verde);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;}
  @media(max-width:640px){ .item{flex-direction:column;gap:6px;} .el{width:auto;} .btns{flex-direction:row;} }
</style>
</head>
<body>
<header>
  <h1>Painel de Revisão — Amor de Cão<small>Copy + tarefas de design · sincronizado ao vivo para todo o time</small></h1>
  <span class="conex" id="conex">conectando…</span>
  <div><div class="prog" id="prog">0 / 0</div><div class="bar"><i id="barra"></i></div></div>
  <div class="filtros" id="filtros">
    <button data-f="todas" class="on">Todas</button>
    <button data-f="pend">Pendentes</button>
    <button data-f="ap">Aprovadas</button>
    <button data-f="aj">Ajustadas</button>
    <button data-f="gap">Faltando copy</button>
  </div>
</header>
<main id="app"><p style="color:#5F6368">Carregando revisão…</p></main>
<footer>
  <span>✅ <span class="f-n" id="nAp">0</span></span>
  <span>✏️ <span class="f-n" id="nAj">0</span></span>
  <span>⏳ <span class="f-n" id="nPe">0</span></span>
  <span id="quem" style="color:#BBB;font-size:12px"></span>
  <span class="sp"></span>
  <button style="background:var(--laranja);color:#fff" onclick="exportar('dev')">📋 DEV</button>
  <button style="background:var(--azul);color:#fff" onclick="exportar('design')">🎨 DESIGN</button>
  <button style="background:var(--pink);color:#fff" onclick="exportar('juridico')">⚖️ JURÍDICO</button>
</footer>
<dialog id="dlg">
  <div class="d-h"><b id="dlgT">Relatório</b><button onclick="document.getElementById('dlg').close()">✕</button></div>
  <pre id="dlgPre"></pre>
  <div class="d-f">
    <button style="background:#EEE" onclick="baixarTxt()">Baixar .md</button>
    <button style="background:#7CB342;color:#fff" onclick="copiarTxt()">Copiar tudo</button>
  </div>
</dialog>
<dialog id="login">
  <div class="l-c">
    <h2>Quem está revisando?</h2>
    <p>Seu nome e papel aparecem junto de cada veredito e comentário.</p>
    <input id="loginNome" placeholder="Seu nome" maxlength="30">
    <select id="loginPapel">
      <option value="CEO">CEO / Estratégia</option>
      <option value="Copy">Copy / Conteúdo</option>
      <option value="Design">Design</option>
      <option value="Dev">Desenvolvimento</option>
    </select>
    <button onclick="entrar()">Começar a revisar</button>
  </div>
</dialog>

// ===== identidade =====
let revisor = localStorage.getItem("revisor_nome") || "";
let papel = localStorage.getItem("revisor_papel") || "";
window.entrar = function(){
  const n = document.getElementById("loginNome").value.trim();
  if(!n){ document.getElementById("loginNome").focus(); return; }
  revisor = n; papel = document.getElementById("loginPapel").value;
  localStorage.setItem("revisor_nome", revisor);
  localStorage.setItem("revisor_papel", papel);
  document.getElementById("login").close();
  document.getElementById("quem").innerHTML = `revisando como: <b class="p-${papel}">${escapeHtml(revisor)} (${papel})</b>`;
  iniciar();
};

// ===== estado =====
let estado = {};      // item_id -> {st, novo, revisor, papel}
let cmts = {};        // item_id -> [{autor,papel,texto,hora}]
let filtroAtivo = "todas";
const app = document.getElementById("app");
const timers = {};

function uid(f,t,i){ return f+"|"+t+"|"+i; }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
window.escapeHtml = escapeHtml;

async function carregar(){
  const [r1, r2] = await Promise.all([
    sb.from("revisao_copy").select("*"),
    sb.from("comentarios").select("*").order("created_at",{ascending:true})
  ]);
  if(r1.error||r2.error){ document.getElementById("conex").textContent="erro de conexão"; return; }
  estado = {}; cmts = {};
  r1.data.forEach(r=>{ if(r.status||r.novo_texto) estado[r.item_id] = {st:r.status, novo:r.novo_texto||"", revisor:r.revisor||"", papel:r.obs||""}; });
  r2.data.forEach(c=>{ (cmts[c.item_id]=cmts[c.item_id]||[]).push({autor:c.autor,papel:c.papel,texto:c.texto,hora:c.created_at}); });
  render();
}
function gravar(id){
  const e = estado[id] || {};
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async ()=>{
    await sb.from("revisao_copy").upsert({ item_id:id, status:e.st||"", novo_texto:e.novo||"", obs:e.papel||papel, revisor:e.revisor||revisor, updated_at:new Date().toISOString() });
  }, 350);
}
async function limpar(id){
  delete estado[id];
  await sb.from("revisao_copy").upsert({item_id:id, status:"", novo_texto:"", obs:"", revisor:"", updated_at:new Date().toISOString()});
}
async function comentar(id, texto){
  if(!texto.trim()) return;
  await sb.from("comentarios").insert({item_id:id, autor:revisor, papel, texto:texto.trim()});
}

// ===== realtime =====
function assinar(){
  sb.channel("revisao")
    .on("postgres_changes", {event:"*", schema:"public", table:"revisao_copy"}, (p)=>{
      const r = p.new; if(!r) return;
      const meu = document.activeElement?.closest?.(`[data-uid="${CSS.escape(r.item_id)}"]`);
      if(!r.status && !r.novo_texto){ delete estado[r.item_id]; }
      else { estado[r.item_id] = {st:r.status, novo:r.novo_texto||"", revisor:r.revisor||"", papel:r.obs||""}; }
      if(!meu) refreshUid(r.item_id);
      atualizarContadores();
    })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"comentarios"}, (p)=>{
      const c = p.new; if(!c) return;
      (cmts[c.item_id]=cmts[c.item_id]||[]).push({autor:c.autor,papel:c.papel,texto:c.texto,hora:c.created_at});
      const box = document.querySelector(`[data-th="${CSS.escape(c.item_id)}"]`);
      if(box){ box.insertAdjacentHTML("beforeend", cmtHtml(c)); }
      const cnt = document.querySelector(`[data-thc="${CSS.escape(c.item_id)}"]`);
      if(cnt) cnt.textContent = "💬 " + (cmts[c.item_id]||[]).length;
    })
    .subscribe((st)=>{
      const c=document.getElementById("conex");
      if(st==="SUBSCRIBED"){ c.textContent="● ao vivo"; c.classList.add("on"); }
      else { c.textContent="reconectando…"; c.classList.remove("on"); }
    });
}
function cmtHtml(c){
  const h = new Date(c.hora||Date.now()).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  return `<div class="cmt"><b class="p-${c.papel||'Copy'}">${escapeHtml(c.autor)}</b><span class="hora">${c.papel||""} · ${h}</span><br>${escapeHtml(c.texto)}</div>`;
}
function threadHtml(id){
  const lista = (cmts[id]||[]).map(cmtHtml).join("");
  return `<div class="thread"><div data-th="${escapeHtml(id)}">${lista}</div>
    <div class="cmt-form"><input placeholder="Comentar… (assinado como ${escapeHtml(revisor)})" maxlength="500"><button>Enviar</button></div></div>`;
}
function ligarThread(container, id){
  const inp = container.querySelector(".cmt-form input");
  const btn = container.querySelector(".cmt-form button");
  const enviar = ()=>{ comentar(id, inp.value); inp.value=""; };
  btn.onclick = enviar;
  inp.onkeydown = (e)=>{ if(e.key==="Enter") enviar(); };
}

// ===== render =====
function passaFiltro(id,it){
  const st = estado[id]?.st || "";
  const tipo = it[2]||"";
  if(filtroAtivo==="todas") return true;
  if(filtroAtivo==="pend") return !st && tipo!=="jur";
  if(filtroAtivo==="ap") return st==="ap";
  if(filtroAtivo==="aj") return st==="aj";
  if(filtroAtivo==="gap") return tipo==="gap";
  return true;
}
function render(){
  app.innerHTML = "";
  DATA.forEach((fl,fi)=>{
    const sec = document.createElement("section"); sec.className="fluxo "+(fl.cls||"");
    sec.innerHTML = `<h2>${fl.fluxo}</h2><p>${fl.desc}</p>`;
    fl.telas.forEach((tela,ti)=>{
      const visiveis = tela.itens.map((it,ii)=>({it,ii})).filter(({it,ii})=>passaFiltro(uid(fi,ti,ii),it));
      if(!visiveis.length && filtroAtivo!=="todas") return;
      const card = document.createElement("div"); card.className="tela"; card.dataset.key=fi+"-"+ti;
      const done = tela.itens.filter((it,ii)=>estado[uid(fi,ti,ii)]?.st).length;
      const idTela = "TELA|"+fi+"|"+ti;
      const nCmts = (cmts[idTela]||[]).length;
      const h = document.createElement("div"); h.className="tela-h";
      h.innerHTML = `<span class="tid">${tela.id}</span><span class="tnome">${tela.nome}</span>
        ${tela.node?`<a class="lk" href="${FIGMA}${tela.node}" target="_blank" rel="noopener">Abrir no Figma ↗</a>`:""}
        <button class="bt-notas" data-thc="${escapeHtml(idTela)}">💬 ${nCmts}</button>
        <span class="tstat">${done}/${tela.itens.length}</span><span class="seta">▶</span>`;
      card.appendChild(h);
      const notas = document.createElement("div"); notas.className="notas-tela";
      notas.innerHTML = `<h4>🎨 Apontamentos da tela (design, dúvidas, qualquer coisa fora da copy)</h4>${threadHtml(idTela)}`;
      ligarThread(notas, idTela);
      card.appendChild(notas);
      const corpo = document.createElement("div"); corpo.className="tela-corpo";
      (filtroAtivo==="todas" ? tela.itens.map((it,ii)=>({it,ii})) : visiveis).forEach(({it,ii})=>{
        corpo.appendChild(renderItem(fi,ti,ii,it));
      });
      card.appendChild(corpo);
      h.onclick = (ev)=>{
        if(ev.target.closest(".lk")) return;
        if(ev.target.closest(".bt-notas")){ notas.classList.toggle("aberta"); card.classList.add("aberta"); return; }
        card.classList.toggle("aberta");
      };
      if(filtroAtivo!=="todas") card.classList.add("aberta");
      sec.appendChild(card);
    });
    if(sec.querySelector(".tela")) app.appendChild(sec);
  });
  atualizarContadores();
}
function renderItem(fi,ti,ii,it){
  const id = uid(fi,ti,ii);
  const [el, txt, tipo, nota] = it;
  const e = estado[id] || {};
  const div = document.createElement("div");
  div.dataset.uid = id;
  div.className = "item"+(tipo&&tipo!=="tar"?" "+tipo:"")+(e.st==="ap"?" ap":"")+(e.st==="aj"?" aj editando":"");
  let badges = "";
  if(tipo==="jur") badges += `<span class="badge bd-jur">JURÍDICO — travada pelo advogado</span> `;
  if(tipo==="gap") badges += `<span class="badge bd-gap">FALTA COPY — escrever</span> `;
  if(tipo==="prop") badges += `<span class="badge bd-obs">PROPOSTA NOVA — aprovar ou editar</span> `;
  if(e.st && e.revisor){
    const acao = tipo==="tar" ? "concluída" : (e.st==="ap"?"aprovada":"ajustada");
    badges += `<span class="badge bd-quem">${acao} por <span class="p-${e.papel||'Copy'}">${escapeHtml(e.revisor)}</span></span> `;
  }
  const nC = (cmts[id]||[]).length;
  div.innerHTML = `
    <div class="el">${el}</div>
    <div class="meio">
      ${badges?`<div>${badges}</div>`:""}
      <div class="copy">${escapeHtml(txt)}</div>
      ${nota?`<div class="nota">💡 ${escapeHtml(nota)}</div>`:""}
      ${tipo!=="tar"?`<div class="edit"><textarea placeholder="${tipo==='gap'?'Escreva aqui a copy proposta…':'Escreva aqui a nova versão…'}">${escapeHtml(e.novo||"")}</textarea></div>`:""}
      ${threadHtml(id)}
    </div>
    <div class="btns">${tipo==="jur"
      ? `<div class="lock">🔒 não editável</div>`
      : tipo==="tar"
      ? `<button class="b-ap ${e.st==='ap'?'on':''}">${e.st==='ap'?'✓ Feito':'Concluir'}</button>${e.st?`<button class="b-x">reabrir</button>`:""}`
      : `<button class="b-ap ${e.st==='ap'?'on':''}">✓ Aprovar</button>
         <button class="b-aj ${e.st==='aj'?'on':''}">✎ Ajustar</button>
         ${e.st?`<button class="b-x">limpar</button>`:""}`}
    </div>`;
  ligarThread(div, id);
  if(tipo!=="jur"){
    const bAp = div.querySelector(".b-ap");
    if(bAp) bAp.onclick = ()=>{ estado[id]={st:"ap",novo:"",revisor,papel}; gravar(id); refreshUid(id); };
    const bAj = div.querySelector(".b-aj");
    if(bAj) bAj.onclick = ()=>{ estado[id]={st:"aj", novo:estado[id]?.novo || (tipo==="gap"?"":txt), revisor, papel}; gravar(id); refreshUid(id, true); };
    const bx = div.querySelector(".b-x");
    if(bx) bx.onclick = ()=>{ limpar(id); refreshUid(id); atualizarContadores(); };
    const ta = div.querySelector(".edit textarea");
    if(ta) ta.oninput = ()=>{ estado[id]=estado[id]||{st:"aj"}; estado[id].novo=ta.value; estado[id].revisor=revisor; estado[id].papel=papel; gravar(id); };
  }
  return div;
}
function localizarItem(id){
  const [fi,ti,ii] = id.split("|").map(Number);
  return {fi,ti,ii,it:DATA[fi]?.telas[ti]?.itens[ii]};
}
function refreshUid(id, foco){
  if(id.startsWith("TELA|")) return;
  const alvo = document.querySelector(`[data-uid="${CSS.escape(id)}"]`);
  const {fi,ti,ii,it} = localizarItem(id);
  if(!alvo || !it) return;
  const novo = renderItem(fi,ti,ii,it);
  alvo.replaceWith(novo);
  const card = document.querySelector(`.tela[data-key="${fi}-${ti}"]`);
  if(card){ const done = DATA[fi].telas[ti].itens.filter((x,xi)=>estado[uid(fi,ti,xi)]?.st).length;
    card.querySelector(".tstat").textContent = `${done}/${DATA[fi].telas[ti].itens.length}`; }
  if(foco){ const ta=novo.querySelector(".edit textarea"); if(ta) ta.focus(); }
}
function atualizarContadores(){
  let ap=0,aj=0,tot=0;
  DATA.forEach((fl,fi)=>fl.telas.forEach((t,ti)=>t.itens.forEach((it,ii)=>{
    if((it[2]||"")==="jur") return;
    tot++;
    const st = estado[uid(fi,ti,ii)]?.st;
    if(st==="ap")ap++; if(st==="aj")aj++;
  })));
  document.getElementById("nAp").textContent=ap;
  document.getElementById("nAj").textContent=aj;
  document.getElementById("nPe").textContent=tot-ap-aj;
  document.getElementById("prog").textContent=(ap+aj)+" / "+tot;
  document.getElementById("barra").style.width = tot? (100*(ap+aj)/tot)+"%" : "0%";
}
document.getElementById("filtros").onclick = (ev)=>{
  const b = ev.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filtros button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filtroAtivo = b.dataset.f; render();
};

// ===== relatórios =====
let txtAtual = "", nomeArq = "relatorio.md";
window.copiarTxt = ()=>navigator.clipboard.writeText(txtAtual).then(()=>alert("Copiado!"));
window.baixarTxt = ()=>{ const b=new Blob([txtAtual],{type:"text/markdown"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nomeArq; a.click(); };
window.exportar = function(tipo){
  const d = new Date().toLocaleDateString("pt-BR");
  let out = "";
  if(tipo==="dev"){
    out = `# Instruções de alteração de copy — Amor de Cão (${d})\nAplicar cada alteração DE → PARA exatamente como escrito, incluindo pontuação. Strings [JURÍDICO] não podem ser alteradas.\n\n`;
    DATA.forEach((fl,fi)=>{ if(fi===0) return; let bloco="";
      fl.telas.forEach((t,ti)=>{ let l="";
        t.itens.forEach((it,ii)=>{ const e=estado[uid(fi,ti,ii)]; const tp=it[2]||"";
          if(tp==="jur"||tp==="tar") return;
          if(e?.st==="aj" && (e.novo||"").trim()){
            l += tp==="gap" ? `- **${it[0]}** — COPY NOVA:\n  - INSERIR: "${e.novo.trim()}"\n`
                            : `- **${it[0]}**\n  - DE: "${it[1]}"\n  - PARA: "${e.novo.trim()}"\n`;
            l += `  - Por: ${e.revisor} (${e.papel||"?"})\n`;
            (cmts[uid(fi,ti,ii)]||[]).forEach(c=>{ l+=`  - 💬 ${c.autor}: ${c.texto}\n`; });
          }});
        if(l) bloco += `### ${t.id} — ${t.nome}\n${l}\n`; });
      if(bloco) out += `## ${fl.fluxo}\n\n${bloco}`; });
    nomeArq="instrucoes_dev.md";
  }
  if(tipo==="design"){
    out = `# Tarefas de Design — Amor de Cão (${d})\n\n## Checklist\n`;
    DATA[0].telas.forEach((t,ti)=>{ out+=`\n### ${t.nome}\n`;
      t.itens.forEach((it,ii)=>{ const e=estado[uid(0,ti,ii)];
        out += `- [${e?.st==="ap"?"x":" "}] **${it[0]}** — ${it[1]}${e?.st==="ap"?` _(feito por ${e.revisor})_`:""}\n`;
        (cmts[uid(0,ti,ii)]||[]).forEach(c=>{ out+=`  - 💬 ${c.autor}: ${c.texto}\n`; });
      });});
    out += `\n## Apontamentos por tela\n`;
    DATA.forEach((fl,fi)=>{ if(fi===0) return;
      fl.telas.forEach((t,ti)=>{ const th = cmts["TELA|"+fi+"|"+ti]||[];
        if(th.length){ out+=`\n### ${t.id} — ${t.nome}\n`; th.forEach(c=>{ out+=`- ${c.autor} (${c.papel}): ${c.texto}\n`; }); } });});
    nomeArq="tarefas_design.md";
  }
  if(tipo==="juridico"){
    out = `# Pendências jurídicas — Amor de Cão (${d})\n\n`;
    out += `1. Termos de Uso do app (incluir aviso de não substituição de avaliação veterinária — pendência da Régua, Parte 4).\n`;
    out += `2. Política de Privacidade (incluir tratamento de dados de saúde do cão — pendência da Régua).\n`;
    out += `3. Termos de uso para anúncios de adoção (checkbox já existe na T-020).\n`;
    out += `4. Copy do modal de denúncia de perfil (ReportModal) — motivos estruturados SEM opção de maus-tratos (trava do Handoff de Adoção).\n`;
    out += `5. Registrar por escrito, como aditivo da Régua, o aval do advogado ao selo público "Vem do Diário do {nome}" (decisão D2).\n`;
    out += `\n## Comentários em itens jurídicos\n`;
    DATA.forEach((fl,fi)=>fl.telas.forEach((t,ti)=>t.itens.forEach((it,ii)=>{
      if((it[2]||"")!=="jur") return;
      const th = cmts[uid(fi,ti,ii)]||[];
      if(th.length){ out+=`\n### ${t.id} — ${it[0]}\n`; th.forEach(c=>{ out+=`- ${c.autor} (${c.papel}): ${c.texto}\n`; }); }
    })));
    nomeArq="pendencias_juridico.md";
  }
  txtAtual = out;
  document.getElementById("dlgT").textContent = {dev:"Instruções para o DEV",design:"Tarefas para o DESIGN",juridico:"Pendências para o JURÍDICO"}[tipo];
  document.getElementById("dlgPre").textContent = out;
  document.getElementById("dlg").showModal();
};

if(revisor && papel){
  document.getElementById("quem").innerHTML = `revisando como: <b class="p-${papel}">${escapeHtml(revisor)} (${papel})</b>`;
  iniciar();
} else {
  document.getElementById("login").showModal();
}
